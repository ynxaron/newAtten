<div class="container-fluid bg-light min-vh-100 d-flex align-items-center">
  <div class="container p-5 rounded shadow bg-white" style="max-width: 600px;">

      <div class="text-center">
          <img
              ng-src="{{djuboIcon}}"
              alt="DJUBO Logo"
              style="max-width: 100%; max-height: 85px"
          />
      </div>
      <p class="h1 mb-4 text-center tw-bold" style="color:#825995">Pick Your Leave Dates</p>
    <hr>

    <div class="mb-3 pt-5">
      <label for="leaveBegin" class="form-label h5">Date Begin</label>
      <input
        type="text" class="form-control"
        id="leaveBegin" placeholder="Leave Begin"
        ng-model="leaveBeginDate"
      >
    </div>

    <div class="mb-3">
      <label for="leaveEnd" class="form-label h5">Date End</label>
      <input
        type="text" class="form-control"
        id="leaveEnd" placeholder="Leave End"
        ng-model="leaveEndDate"
      >
    </div>

    <div class="mb-3">
      <label for="reasonForLeave" class="form-label h5">Reason</label>
      <input
        type="text" class="form-control"
        id="reasonForLeave" placeholder="Reason To Leave"
        ng-model="reason"
      >
    </div>

    <div class="text-center">
      <button class="btn px-4 py-2 mt-3" style="background-color:#825995; color: white" ng-click="submitLeave()">
        Apply For Leave
      </button>
    </div>
  </div>
</div>
