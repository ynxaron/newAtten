<div class="container-fluid p-0 m-0">
    <!-- Main Settings Panel -->
    <div class="col p-4" style="margin-left: 260px">
        <h3 class="fw-bold mb-4">Settings</h3>

        <div class="row g-4">
            <!-- Profile Settings -->
            <div class="col-md-6">
                <div class="stat-box text-start">
                    <h5 class="mb-3">Profile Settings</h5>
                    <form>
                        <div class="mb-3">
                            <label for="fullName" class="form-label"
                                >Full Name</label
                            >
                            <input
                                type="text"
                                class="form-control"
                                id="fullName"
                                value="Satyam Prakash"
                            />
                        </div>
                        <div class="mb-3">
                            <label for="email" class="form-label"
                                >Email address</label
                            >
                            <input
                                type="email"
                                class="form-control"
                                id="email"
                                value="satyam@example.com"
                            />
                        </div>
                        <div class="mb-3">
                            <label for="role" class="form-label">Role</label>
                            <input
                                type="text"
                                class="form-control"
                                id="role"
                                value="Developer"
                            />
                        </div>
                        <button
                            type="submit"
                            class="btn btn-primary"
                            style="background-color: #825995"
                        >
                            Update Profile
                        </button>
                    </form>
                </div>
            </div>

            <!-- Password Settings -->
            <div class="col-md-6">
                <div class="stat-box text-start">
                    <h5 class="mb-3">Change Password</h5>
                    <form>
                        <div class="mb-3">
                            <label for="currentPassword" class="form-label"
                                >Current Password</label
                            >
                            <input
                                type="password"
                                class="form-control"
                                id="currentPassword"
                            />
                        </div>
                        <div class="mb-3">
                            <label for="newPassword" class="form-label"
                                >New Password</label
                            >
                            <input
                                type="password"
                                class="form-control"
                                id="newPassword"
                            />
                        </div>
                        <div class="mb-3">
                            <label for="confirmPassword" class="form-label"
                                >Confirm New Password</label
                            >
                            <input
                                type="password"
                                class="form-control"
                                id="confirmPassword"
                            />
                        </div>
                        <button
                            type="submit"
                            class="btn btn-warning"
                            style="background-color: #825995; color: white"
                        >
                            Update Password
                        </button>
                    </form>
                </div>
            </div>
        </div>

        <div class="mt-5">
            <div class="chart-box text-start">
                <h5>Notification Preferences</h5>
                <div class="form-check form-switch mt-3">
                    <input
                        class="form-check-input"
                        type="checkbox"
                        id="emailNotifs"
                        style="background-color: #825995"
                        checked
                    />
                    <label class="form-check-label" for="emailNotifs"
                        >Email Notifications</label
                    >
                </div>
                <div class="form-check form-switch mt-2">
                    <input
                        class="form-check-input"
                        type="checkbox"
                        id="smsNotifs"
                        style="background-color: #825995"
                    />
                    <label class="form-check-label" for="smsNotifs"
                        >SMS Alerts</label
                    >
                </div>
            </div>
        </div>
    </div>
</div>
